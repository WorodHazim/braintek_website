name: BRAINTEK CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://braintek.ae
      NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
      STRAPI_URL: http://localhost:1337
      APP_KEYS: ci-key-1,ci-key-2,ci-key-3,ci-key-4
      API_TOKEN_SALT: ci-api-token-salt
      ADMIN_JWT_SECRET: ci-admin-jwt-secret
      TRANSFER_TOKEN_SALT: ci-transfer-token-salt
      JWT_SECRET: ci-jwt-secret
      PREVIEW_SECRET: ci-preview-secret
      DATABASE_CLIENT: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: braintek_ci
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SSL: "false"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: braintek_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d braintek_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build public website
        run: npm run build:web
      - name: Build CMS and admin
        run: npm run build:cms
      - name: Lint public website
        run: npm --workspace apps/web run lint
